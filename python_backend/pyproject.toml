[project]
name = "python-backend"
version = "0.1.0"
description = "This will be the python backend for the Recallr project."

authors = [
    { name = "Denzel Irizarry", email = "denzel_irizarry@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
]

[project.scripts]
python-backend = "python_backend:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
